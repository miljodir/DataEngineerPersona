  postgres4:
    image: docker.io/postgis/postgis:18-3.6
    container_name: postgres4
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "54322:5432"
    volumes:
      - postgres-data4:/var/lib/postgresql
      - ./scripts/podman/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./data:/data
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres3:
    image: docker.io/postgis/postgis:18-3.6
    container_name: postgres3
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "54321:5432"
    volumes:
      - postgres-data3:/var/lib/postgresql
      - ./scripts/podman/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./data:/data
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  postgres-data4:
  postgres-data3:
