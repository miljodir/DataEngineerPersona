# ora2pg.conf for WideWorldImporters Demo
# Minimal config for SQL Server to PostgreSQL assessment mode
# Place this file at samples/wide-world-importers/ora2pg.conf

# Use MSSQL mode
MSSQL_DSN dbi:ODBC:driver=msodbcsql18;Server=127.0.0.1;Database=WideWorldImporters;Encrypt=No
MSSQL_USER sa
MSSQL_PWD Str0ngP@ssw0rd!
ORACLE_DSN dbi:ODBC:driver=msodbcsql18;Server=127.0.0.1;Database=WideWorldImporters;Encrypt=No
ORACLE_USER sa
ORACLE_PWD Str0ngP@ssw0rd!

PG_DSN "postgresql://wwi_user:Str0ngP@ssw0rd!@127.0.0.1:5432/wide_world_importers"
# Export only schema for assessment
TYPE SHOW_REPORT

# Output directory
OUTPUT samples/wide-world-importers/

# Schema(s) to include
SCHEMA application,purchasing,sales,warehouse,website,DataLoadSimulation,Integration,Sequences

# Enable cost estimation
ESTIMATE_COST 1

PG_VERSION 16

# Set to true for SQL Server
MSSQL 1

# Logging
#LOGFILE samples/wide-world-importers/ora2pg.log

#LOG_ERRORS 1
# End of file
